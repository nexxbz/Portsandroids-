.hero{width:100%;display:block;border-radius:18px;margin:0 0 20px;box-shadow:0 8px 24px rgba(193,18,31,.25)}
.logo{width:72px;height:72px;border-radius:20px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:32px;font-weight:700;margin:0 auto 16px}
h1{text-align:center;font-size:1.6rem;margin:0}
.sub{text-align:center;color:var(--muted);margin:6px 0 8px}
.badge{display:block;width:max-content;margin:0 auto 28px;font-size:.78rem;color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:2px 10px}
.list{display:flex;flex-direction:column;gap:12px}
a.card{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-decoration:none;color:var(--text)}
a.card:hover{border-color:var(--accent)}
.ico{width:42px;height:42px;border-radius:11px;background:var(--bg);display:grid;place-items:center;flex:none;border:1px solid var(--line)}
.ico svg{width:24px;height:24px;fill:#fff}
.name{font-weight:600}
.handle{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.arrow{margin-left:auto;color:var(--muted)}
.note{margin-top:28px;font-size:.8rem;color:var(--muted);text-align:center}
.updated{margin-top:6px}
</style>
</head>
